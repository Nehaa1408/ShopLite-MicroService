spring.application.name=admin-service

server.port=8080

# Eureka Client

eureka.client.service-url.defaultZone=http://shoplite-eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenFeign

spring.cloud.openfeign.client.config.default.connectTimeout=10000
spring.cloud.openfeign.client.config.default.readTimeout=60000
