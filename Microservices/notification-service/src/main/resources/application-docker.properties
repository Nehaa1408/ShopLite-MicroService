spring.application.name=notification-service

server.port=8086

# Eureka

eureka.client.service-url.defaultZone=http://shoplite-eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# MySQL

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/shoplite_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Swagger

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# OpenFeign

spring.cloud.openfeign.client.config.default.connectTimeout=10000
spring.cloud.openfeign.client.config.default.readTimeout=60000

# ================= KAFKA =================

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.notification_service.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.notification_service.dto.OrderPlacedNotificationRequest
