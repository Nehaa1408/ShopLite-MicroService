spring.application.name=product-service
server.port=8082

# Eureka
eureka.client.service-url.defaultZone=http://shoplite-eureka-server:8761/eureka/

# MySQL - existing Windows MySQL server
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/shoplite_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Zipkin Distributed Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://shoplite-zipkin:9411/api/v2/spans