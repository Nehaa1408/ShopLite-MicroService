services:
  eureka-server:
    image: shoplite-eureka-server
    container_name: shoplite-eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  user-service:
    image: shoplite-user-service
    container_name: shoplite-user-service
    ports:
      - "8081:8081"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  product-service:
    image: shoplite-product-service
    container_name: shoplite-product-service
    ports:
      - "8082:8082"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  product-service-replica:
    image: shoplite-product-service
    container_name: shoplite-product-service-replica
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    networks:
      - shoplite-network
    restart: unless-stopped

  cart-service:
    image: shoplite-cart-service
    container_name: shoplite-cart-service
    ports:
      - "8083:8083"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  order-service:
    image: shoplite-order-service
    container_name: shoplite-order-service
    ports:
      - "8084:8084"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  delivery-service:
    image: shoplite-delivery-service
    container_name: shoplite-delivery-service
    ports:
      - "8085:8085"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  notification-service:
    image: shoplite-notification-service
    container_name: shoplite-notification-service
    ports:
      - "8086:8086"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  ticket-service:
    image: shoplite-ticket-service
    container_name: shoplite-ticket-service
    ports:
      - "8087:8087"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  admin-service:
    image: shoplite-admin-service
    container_name: shoplite-admin-service
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  api-gateway:
    image: shoplite-api-gateway:latest
    container_name: shoplite-api-gateway
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - shoplite-network
    restart: unless-stopped

  frontend:
    image: shoplite-frontend:latest
    container_name: shoplite-frontend-compose
    ports:
      - "5173:80"
    networks:
      - shoplite-network
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: shoplite-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - shoplite-network
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: shoplite-zipkin
    ports:
      - "9411:9411"
    networks:
      - shoplite-network
    restart: unless-stopped

networks:
  shoplite-network:
    external: true
    name: shoplite-network
