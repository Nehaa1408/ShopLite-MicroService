version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: shoplite-mysql

    environment:
      MYSQL_ROOT_PASSWORD: Nehaa@1408
      MYSQL_DATABASE: shoplite_db

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  shoplite:
    build: .
    container_name: shoplite-backend

    ports:
      - "8080:8080"

    depends_on:
      - mysql

volumes:
  mysql-data:
